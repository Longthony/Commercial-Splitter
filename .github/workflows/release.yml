name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Download FFmpeg tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
          $bin = Get-ChildItem "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $bin) { throw "FFmpeg executable not found" }
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe", "ffplay.exe")) {
            $source = Join-Path $bin.DirectoryName $name
            if (!(Test-Path $source)) { throw "$name not found" }
            Copy-Item $source "tools/$name"
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          $args = @(
            '--noconfirm', '--clean', '--onefile', '--windowed',
            '--name', 'Commercial Splitter',
            '--icon=assets/commercial_splitter.ico',
            '--add-data=assets/commercial_splitter.ico;.',
            '--collect-all', 'PySide6.QtMultimedia',
            '--collect-all', 'PySide6.QtMultimediaWidgets'
          )
          foreach ($tool in @('ffmpeg', 'ffprobe', 'ffplay')) {
            $path = "tools/$tool.exe"
            if (Test-Path $path) {
              $args += "--add-binary=$path;tools"
            }
          }
          $args += 'src/Commercial_Splitter.py'
          python -m PyInstaller @args

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/Commercial Splitter.exe')) {
            throw 'Windows executable not found'
          }
          Get-FileHash 'dist/Commercial Splitter.exe' -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Commercial-Splitter-Windows
          path: dist/Commercial Splitter.exe
          if-no-files-found: error
          retention-days: 30
